<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DECORUM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root{
    --cream:#eee8dc;
    --muted:#aaa398;
    --black:#080807;
    --gold:#b99a5d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--black);
    color:var(--cream);
}

body{
    font-family:Inter,sans-serif;
}


/* =========================================
   EXPERIENCE
========================================= */

.experience{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
}


/* =========================================
   SCENES
========================================= */

.scene{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    background-size:cover;
    background-position:center;

    transition:
        transform 2s cubic-bezier(.2,.8,.2,1),
        opacity 1.4s ease,
        filter 1.2s ease;
}


/* OUTSIDE */

.exterior{
    z-index:2;
    background-image:url("exterior.png");

    transform:scale(1.02);
}


/* FOYER */

.foyer{
    z-index:1;

    background-image:url("foyer.png");

    opacity:0;
    transform:scale(1.15);

    filter:brightness(.6);
}


/* =========================================
   CINEMATIC OVERLAY
========================================= */

.scene::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.35),
            transparent 35%,
            transparent 70%,
            rgba(0,0,0,.3)
        ),
        linear-gradient(
            0deg,
            rgba(0,0,0,.45),
            transparent 45%
        );
}


/* =========================================
   TOP BRAND
========================================= */

.brand{
    position:absolute;

    z-index:20;

    top:31px;
    left:50%;

    transform:translateX(-50%);

    font-family:"Cormorant Garamond",serif;

    font-size:29px;

    letter-spacing:.32em;

    white-space:nowrap;
}


/* =========================================
   LOCATION
========================================= */

.location{
    position:absolute;

    z-index:20;

    top:38px;
    right:40px;

    font-size:8px;

    letter-spacing:.28em;

    color:var(--muted);
}


/* =========================================
   ROMAN NAV
========================================= */

.roman{
    position:absolute;

    z-index:20;

    top:38px;
    left:40px;

    display:flex;

    gap:27px;
}

.roman button{
    border:0;

    background:none;

    color:rgba(238,232,220,.65);

    font-family:"Cormorant Garamond",serif;

    font-size:15px;

    cursor:pointer;

    transition:
        color .3s ease,
        transform .3s ease;
}

.roman button:hover{
    color:white;

    transform:translateY(-2px);
}


/* =========================================
   ENTER
========================================= */

.enter{
    position:absolute;

    z-index:30;

    bottom:36px;
    right:40px;

    display:flex;
    align-items:center;

    gap:15px;

    color:var(--cream);

    font-size:9px;

    letter-spacing:.32em;

    cursor:pointer;

    transition:opacity .3s ease;
}

.enter:hover{
    opacity:.55;
}

.arrow{
    font-size:22px;
}


/* =========================================
   DOOR HOTSPOT
========================================= */

.door{
    position:absolute;

    z-index:15;

    /*
       Adjust these values depending
       on your exterior image.
    */

    left:43%;
    top:48%;

    width:15%;
    height:35%;

    cursor:pointer;

    background:transparent;

    border:0;
}


/* subtle glow when hovering */

.door::after{
    content:"";

    position:absolute;

    inset:0;

    border:1px solid transparent;

    transition:
        border .4s ease,
        background .4s ease;
}

.door:hover::after{
    border:1px solid rgba(238,232,220,.25);

    background:rgba(255,255,255,.025);
}


/* =========================================
   DOOR LABEL
========================================= */

.door-label{
    position:absolute;

    z-index:20;

    left:50%;
    top:43%;

    transform:
        translate(-50%,-50%)
        translateY(15px);

    opacity:0;

    font-family:"Cormorant Garamond",serif;

    font-size:14px;

    letter-spacing:.18em;

    pointer-events:none;

    transition:
        opacity .4s ease,
        transform .4s ease;
}

.door:hover + .door-label{
    opacity:1;

    transform:
        translate(-50%,-50%)
        translateY(0);
}


/* =========================================
   BOTTOM LINE
========================================= */

.bottom-line{
    position:absolute;

    z-index:20;

    left:40px;
    bottom:40px;

    width:31px;

    height:1px;

    background:rgba(238,232,220,.8);
}


/* =========================================
   INTRO FADE
========================================= */

.intro{
    position:absolute;

    z-index:100;

    inset:0;

    background:#080807;

    display:flex;

    align-items:center;
    justify-content:center;

    transition:
        opacity 1.5s ease,
        visibility 1.5s ease;
}

.intro.hide{
    opacity:0;

    visibility:hidden;
}

.intro-logo{
    font-family:"Cormorant Garamond",serif;

    font-size:clamp(42px,7vw,90px);

    font-weight:300;

    letter-spacing:.3em;

    margin-left:.3em;

    animation:
        logoIn 1.5s ease forwards;
}

@keyframes logoIn{

    from{
        opacity:0;

        transform:
            translateY(15px);
    }

    to{
        opacity:1;

        transform:
            translateY(0);
    }

}


/* =========================================
   DOOR OPEN TRANSITION
========================================= */

.entering .exterior{

    transform:
        scale(1.18);

    opacity:0;

    filter:brightness(.35);
}

.entering .foyer{

    z-index:10;

    opacity:1;

    transform:
        scale(1.02);

    filter:brightness(1);
}


/* =========================================
   BLACK FLASH
========================================= */

.flash{
    position:absolute;

    z-index:90;

    inset:0;

    background:#050504;

    opacity:0;

    pointer-events:none;
}

.entering .flash{

    animation:
        doorFlash 1.7s ease;
}

@keyframes doorFlash{

    0%{
        opacity:0;
    }

    45%{
        opacity:.9;
    }

    100%{
        opacity:0;
    }

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:700px){

    .brand{
        font-size:21px;

        top:24px;
    }

    .location{
        top:28px;

        right:20px;

        font-size:6px;
    }

    .roman{
        top:65px;

        left:20px;

        gap:17px;
    }

    .roman button{
        font-size:13px;
    }

    .enter{
        right:20px;

        bottom:24px;
    }

    .bottom-line{
        left:20px;

        bottom:28px;
    }

    .door{
        left:35%;
        top:45%;

        width:30%;
        height:40%;
    }

}

</style>
</head>


<body>


<div class="experience" id="experience">


    <!-- =====================================
         INTRO
    ====================================== -->

    <div class="intro" id="intro">

        <div class="intro-logo">
            DECORUM
        </div>

    </div>


    <!-- =====================================
         EXTERIOR
    ====================================== -->

    <div class="scene exterior"></div>


    <!-- =====================================
         FOYER
    ====================================== -->

    <div class="scene foyer"></div>


    <!-- =====================================
         TOP UI
    ====================================== -->

    <div class="brand">
        DECORUM
    </div>


    <div class="location">
        BLOEMFONTEIN / ZA
    </div>


    <!-- =====================================
         ROMAN NAV
    ====================================== -->

    <nav class="roman">

        <button onclick="openRoom('art')">
            I
        </button>

        <button onclick="openRoom('house')">
            II
        </button>

        <button onclick="openRoom('collection')">
            III
        </button>

        <button onclick="openRoom('shop')">
            IV
        </button>

    </nav>


    <!-- =====================================
         DOOR
    ====================================== -->

    <button
        class="door"
        onclick="enterHouse()"
        aria-label="Enter DECORUM">
    </button>


    <div class="door-label">
        ENTER
    </div>


    <!-- =====================================
         BOTTOM
    ====================================== -->

    <div class="bottom-line"></div>


    <div
        class="enter"
        onclick="enterHouse()">

        ENTER

        <span class="arrow">
            →
        </span>

    </div>


    <!-- TRANSITION -->

    <div class="flash"></div>


</div>


<script>


/* =========================================
   INTRO
========================================= */

window.addEventListener("load",()=>{

    setTimeout(()=>{

        document
            .getElementById("intro")
            .classList.add("hide");

    },1800);

});


/* =========================================
   ENTER HOUSE
========================================= */

let entered = false;

function enterHouse(){

    if(entered) return;

    entered = true;

    const experience =
        document.getElementById("experience");

    /*
       This is the important moment:

       exterior zooms away
       foyer comes forward
       black flash hides the image swap
    */

    experience.classList.add("entering");


    /*
       Give the transition time to complete,
       then make the foyer the active scene.
    */

    setTimeout(()=>{

        window.location.href =
            "house.html";

    },1800);

}


/* =========================================
   ROMAN NAV
========================================= */

function openRoom(room){

    /*
       Once the house exists,
       these become direct room entrances.
    */

    if(room === "art"){

        window.location.href =
            "art.html";

    }

    if(room === "house"){

        window.location.href =
            "house.html";

    }

    if(room === "collection"){

        window.location.href =
            "collection.html";

    }

    if(room === "shop"){

        window.location.href =
            "shop.html";

    }

}

</script>

</body>
</html>
