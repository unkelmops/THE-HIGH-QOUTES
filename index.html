:root{

canvas{
  display:block;
}

#intro{

  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#080807;
  cursor:pointer;
  transition:opacity 1.2s ease, visibility 1.2s ease;

#intro.hidden{
  opacity:0;

  pointer-events:none;
}

.intro-inner{
  text-align:center;
}

.intro-logo{

  font-size:clamp(58px,9vw,125px);

.intro-line{

.intro-enter{

}

#hud{

.brand{

  top:28px;
  left:32px;

.index{

  gap:24px;

  font-size:17px;

.index span{

.controls{

  left:32px;

  letter-spacing:.2em;

}

  left:50%;

  height:5px;

#interaction{

  THREE.PCFSoftShadowMap;

========================================================= */

function mat(
  color,
  roughness=.75,
  metalness=0
){

  return new THREE.MeshStandardMaterial({
    color,
    roughness,
    metalness
  });

}

/* =========================================================
   HELPERS
========================================================= */

const colliders = [];

function box(
  w,h,d,
  material,
  x=0,y=0,z=0,
  ry=0,
  collision=false
){

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(w,h,d),
      material
    );

  mesh.position.set(x,y,z);
  mesh.rotation.y=ry;

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  if(collision){
    colliders.push({
      mesh,
      w,
      h,
      d
    });
  }

  return mesh;
}


function cylinder(
  r,h,
  material,
  x=0,y=0,z=0
){

  const mesh =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        r,r,h,20
      ),
      material
    );

  mesh.position.set(x,y,z);

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  scene.add(mesh);

  return mesh;
}


function sphere(
  r,
  material,
  x=0,y=0,z=0
){

  const mesh =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        r,18,14
      ),
      material
    );

  mesh.position.set(x,y,z);

  mesh.castShadow=true;

  scene.add(mesh);

  return mesh;
}


/* =========================================================
   FLOOR PLANKS
========================================================= */

function floor(
  width,
  depth,
  x,
  y,
  z
){

  box(
    width,
    .18,
    depth,
    darkWood,
    x,
    y,
    z
  );

  const plankWidth=1.15;

  for(
    let px=x-width/2+plankWidth/2;
    px<x+width/2;
    px+=plankWidth
  ){

    for(
      let pz=z-depth/2+.75;
      pz<z+depth/2;
      pz+=1.8
    ){

      const p =
        box(
          plankWidth-.025,
          .025,
          1.72,
          oak,
          px,
          y+.095,
          pz
        );

      p.material =
        p.material.clone();

      p.material.color.setHex(
        Math.random()>.5
        ? 0x4b3b2d
        : 0x594635
      );

    }
  }
}

let doorOpen=false;
let doorAnimating=false;


function toggleDoor(){

  if(doorAnimating) return;

  doorAnimating=true;

  const start=
    doorGroup.rotation.y;

  const end=
    doorOpen
    ? 0
    : -Math.PI*.48;

  const duration=650;

  const startTime=performance.now();

  function animateDoor(now){

    const t=
      Math.min(
        (now-startTime)/duration,
        1
      );

    const eased =
      t<.5
      ? 2*t*t
      : 1-Math.pow(-2*t+2,2)/2;

    doorGroup.rotation.y =
      THREE.MathUtils.lerp(
        start,
        end,
        eased
      );

    if(t<1){
      requestAnimationFrame(animateDoor);
    }else{
      doorOpen=!doorOpen;
      doorAnimating=false;
    }
  }

  requestAnimationFrame(animateDoor);
}

function windowUnit(
  x,
  y,
  z,
  rot=0,
  width=3.2,
  height=2.4
){

  const group =
    new THREE.Group();

  group.position.set(
    x,y,z
  );

  group.rotation.y=rot;

  scene.add(group);


  const pane =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        height,
        .08
      ),
      glass
    );

  pane.castShadow=true;

  group.add(pane);


  const frame=.09;

  const top =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width+.18,
        frame,
        .15
      ),
      blackMetal
    );

  top.position.y=
    height/2;

  group.add(top);


  const bottom =
    top.clone();

  bottom.position.y=
    -height/2;

  group.add(bottom);


  const left =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        frame,
        height,
        .15
      ),
      blackMetal
    );

  left.position.x=
    -width/2;

  group.add(left);


  const right =
    left.clone();

  right.position.x=
    width/2;

  group.add(right);


  return group;
}

/* =========================================================

========================================================= */

function numeral(
  text,
  x,y,z
){

  const canvas =
    document.createElement("canvas");

  canvas.width=256;
  canvas.height=256;

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(
    0,0,256,256
  );

  ctx.fillStyle=
    "rgba(232,225,213,.48)";

  ctx.font=
    "110px Georgia";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillText(
    text,
    128,
    128
  );

  const texture =
    new THREE.CanvasTexture(canvas);

  const sprite =
    new THREE.Sprite(
      new THREE.SpriteMaterial({
        map:texture,
        transparent:true
      })
    );

  sprite.position.set(
    x,y,z
  );

  sprite.scale.set(
    1.2,
    1.2,
    1
  );

  scene.add(sprite);

  return sprite;
}

/* =========================================================
   FLOOR / STAIRS
========================================================= */

function getFloorHeight(){

  const x=
    camera.position.x;

  const z=
    camera.position.z;


  /*
    Staircase runs approximately:

    z = 4.2 → -4.38

    and rises toward upper floor.
  */

  const inStairs =
    x>6.4 &&
    x<9.5 &&
    z<4.6 &&
    z>-5.2;


  if(inStairs){

    const progress =
      THREE.MathUtils.clamp(
        (4.6-z)/9.8,
        0,
        1
      );

    return THREE.MathUtils.lerp(
      1.65,
      6.95,
      progress
    );

  }


  /*
    upstairs area
  */

  if(
    camera.position.y>4
  ){

    return 6.95;

  }


  return 1.65;
}


/* =========================================================
   COLLISION
========================================================= */

function blocked(
  position
){

  const radius=.38;

  for(
    const c of colliders
  ){

    const p=
      c.mesh.position;

    const dx=
      Math.abs(
        position.x-p.x
      );

    const dz=
      Math.abs(
        position.z-p.z
      );

    if(
      dx<
        c.w/2+radius &&
      dz<
        c.d/2+radius
    ){

      /*
        Ignore front door collision
        when open.
      */

      if(
        c.mesh===door
      ){

        if(doorOpen)
          continue;

      }

      return true;
    }

  }

  return false;
}


/* =========================================================
   MOVEMENT
========================================================= */

const keys={};

window.addEventListener(
  "keydown",
  e=>{
    keys[e.code]=true;
  }
);

window.addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);


const velocity =
  new THREE.Vector3();

const direction =
  new THREE.Vector3();

const clock =
  new THREE.Clock();


function movePlayer(dt){

  if(!controls.isLocked)
    return;

  const speed=
    4.1;

  direction.set(0,0,0);

  if(keys.KeyW)
    direction.z-=1;

  if(keys.KeyS)
    direction.z+=1;

  if(keys.KeyA)
    direction.x-=1;

  if(keys.KeyD)
    direction.x+=1;


  if(direction.lengthSq()>0){

    direction.normalize();

    const old =
      camera.position.clone();

    controls.moveRight(
      direction.x*speed*dt
    );

    controls.moveForward(
      -direction.z*speed*dt
    );


    if(
      blocked(camera.position)
    ){

      camera.position.copy(
        old
      );

    }

  }


  /*
    Vertical floor logic.
  */

  const targetY=
    getFloorHeight();

  camera.position.y=
    THREE.MathUtils.lerp(
      camera.position.y,
      targetY,
      Math.min(dt*7,1)
    );


  /*
    House boundary.
  */

  camera.position.x=
    THREE.MathUtils.clamp(
      camera.position.x,
      -9.5,
      9.5
    );

  camera.position.z=
    THREE.MathUtils.clamp(
      camera.position.z,
      -11.2,
      18.5
    );

}


/* =========================================================
   ROOM DETECTION
========================================================= */

let lastRoom="";

function updateRoom(){

  const x=
    camera.position.x;

  const z=
    camera.position.z;

  let room="";

  if(
    camera.position.y>4
  ){

    if(
      x<0 &&
      z<-4
    ){

      room="III";

    }else{

      room="IV";

    }

  }else{

    if(
      x<-2 &&
      z>-3
    ){

      room="I";

    }else if(
      x>2 &&
      z<-1
    ){

      room="II";

    }

  }


  if(room!==lastRoom){

    lastRoom=room;

    ["n1","n2","n3","n4"]
      .forEach(id=>{
        document
          .getElementById(id)
          .classList.remove(
            "active"
          );
      });


    if(room){

      const el=
        document.getElementById(
          "n"+room
        );

      if(el)
        el.classList.add(
          "active"
        );

    }

  }

}


/* =========================================================
   INTERACTION RAYCAST
========================================================= */

function updateInteraction(){

  if(!controls.isLocked){

    interaction.classList.remove(
      "visible"
    );

    return;
  }


  raycaster.setFromCamera(
    center,
    camera
  );


  const objects =
    interactables.map(
      o=>o.mesh
    );


  const hits =
    raycaster.intersectObjects(
      objects,
      false
    );


  if(hits.length){

    const found =
      interactables.find(
        o=>o.mesh===hits[0].object
      );

    if(found){

      activeObject=found;

      interaction.textContent=
        "[ E ]  "+found.label;

      interaction.classList.add(
        "visible"
      );

      return;

    }

  }


  activeObject=null;

  interaction.classList.remove(
    "visible"
  );

}


window.addEventListener(
  "keydown",
  e=>{

    if(
      e.code==="KeyE" &&
      activeObject &&
      controls.isLocked
    ){

      activeObject.action();

    }

  }
);

   INTRO STATE
========================================================= */

controls.addEventListener(
  "lock",
  ()=>{
    hasEntered=true;
  }
);


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  const dt=
    Math.min(
      clock.getDelta(),
      .05
    );

  movePlayer(dt);

  updateRoom();

  updateInteraction();

  renderer.render(
    scene,
    camera
  );

}

);
