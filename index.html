<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DECORUM</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>

:root{
    --cream:#eee8dc;
    --muted:#aaa49a;
    --black:#080807;
    --line:rgba(238,232,220,.28);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--black);
    color:var(--cream);
}

body{
    font-family:Inter,sans-serif;
    font-weight:300;
}


/* =====================================================
   EXPERIENCE
===================================================== */

#experience{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#080807;
}


/* =====================================================
   REAL HOUSE
===================================================== */

#house{
    position:absolute;
    inset:0;

    background-image:url("foyer.png");
    background-size:cover;
    background-position:center center;

    transform:scale(1.04);

    transition:
        transform 2.5s cubic-bezier(.2,.8,.2,1),
        filter 1.5s ease;
}


/* cinematic darkness */

#house::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.42),
            transparent 35%,
            transparent 70%,
            rgba(0,0,0,.32)
        ),
        linear-gradient(
            0deg,
            rgba(0,0,0,.45),
            transparent 42%
        );

    pointer-events:none;
}


/* =====================================================
   SUBTLE CAMERA MOVEMENT
===================================================== */

#experience:hover #house{
    transform:scale(1.055);
}


/* =====================================================
   TOP BRAND
===================================================== */

.logo{
    position:absolute;

    z-index:20;

    top:32px;
    left:50%;

    transform:translateX(-50%);

    font-family:"Cormorant Garamond",serif;

    font-size:29px;
    font-weight:400;

    letter-spacing:.32em;

    white-space:nowrap;
}


/* =====================================================
   LOCATION
===================================================== */

.location{
    position:absolute;

    z-index:20;

    top:39px;
    right:42px;

    font-size:8px;

    letter-spacing:.3em;

    color:var(--muted);
}


/* =====================================================
   ROMAN NUMERALS
===================================================== */

.index{
    position:absolute;

    z-index:20;

    top:39px;
    left:42px;

    display:flex;
    gap:28px;
}

.index button{
    appearance:none;

    border:0;
    outline:0;

    background:none;

    color:rgba(238,232,220,.55);

    font-family:"Cormorant Garamond",serif;

    font-size:15px;

    cursor:pointer;

    transition:
        color .3s ease,
        transform .3s ease;
}

.index button:hover{
    color:white;
    transform:translateY(-2px);
}


/* =====================================================
   ENTER
===================================================== */

.enter{
    position:absolute;

    z-index:30;

    right:42px;
    bottom:37px;

    display:flex;
    align-items:center;

    gap:15px;

    font-size:9px;

    letter-spacing:.32em;

    cursor:pointer;

    transition:
        opacity .3s ease,
        transform .3s ease;
}

.enter:hover{
    opacity:.6;
    transform:translateX(3px);
}

.enter-arrow{
    font-size:20px;
}


/* =====================================================
   FRONT DOOR AREA
===================================================== */

/*
   This is positioned over the doorway
   in the realistic house image.

   If your doorway is slightly different,
   only change these four values.
*/

.door{
    position:absolute;

    z-index:15;

    left:42%;
    top:18%;

    width:17%;
    height:65%;

    border:0;

    background:transparent;

    cursor:pointer;
}


/* invisible interaction area */

.door::before{
    content:"";

    position:absolute;
    inset:0;

    border:1px solid transparent;

    transition:
        border .5s ease,
        background .5s ease;
}

.door:hover::before{
    border-color:rgba(238,232,220,.2);
    background:rgba(255,255,255,.025);
}


/* =====================================================
   DOOR MESSAGE
===================================================== */

.door-message{
    position:absolute;

    z-index:25;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        translateY(15px);

    opacity:0;

    pointer-events:none;

    font-family:"Cormorant Garamond",serif;

    font-size:16px;

    letter-spacing:.18em;

    white-space:nowrap;

    transition:
        opacity .5s ease,
        transform .5s ease;
}

.door:hover + .door-message{

    opacity:1;

    transform:
        translate(-50%,-50%)
        translateY(0);
}


/* =====================================================
   BOTTOM MARK
===================================================== */

.bottom-mark{
    position:absolute;

    z-index:20;

    left:42px;
    bottom:40px;

    width:31px;
    height:1px;

    background:rgba(238,232,220,.8);
}


/* =====================================================
   OPENING SCREEN
===================================================== */

#opening{
    position:fixed;

    inset:0;

    z-index:1000;

    background:#080807;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:
        opacity 1.5s ease,
        visibility 1.5s ease;
}

#opening.hide{
    opacity:0;
    visibility:hidden;
}

.opening-logo{

    font-family:"Cormorant Garamond",serif;

    font-size:clamp(45px,8vw,100px);

    font-weight:300;

    letter-spacing:.3em;

    margin-left:.3em;

    animation:
        openingIn 1.6s ease;
}

@keyframes openingIn{

    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}


/* =====================================================
   ENTER TRANSITION
===================================================== */

#experience.entering #house{

    transform:scale(1.22);

    filter:brightness(.45);

}

#experience.entering .door{

    pointer-events:none;

}


/* =====================================================
   BLACK TRANSITION
===================================================== */

#transition{

    position:fixed;

    inset:0;

    z-index:500;

    background:#050504;

    opacity:0;

    pointer-events:none;

    transition:
        opacity 1.2s ease;
}

#experience.entering #transition{

    opacity:1;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .logo{
        top:23px;
        font-size:21px;
    }

    .location{
        top:29px;
        right:20px;
        font-size:6px;
    }

    .index{
        top:66px;
        left:20px;
        gap:18px;
    }

    .index button{
        font-size:13px;
    }

    .enter{
        right:20px;
        bottom:24px;
    }

    .bottom-mark{
        left:20px;
        bottom:28px;
    }

    .door{
        left:29%;
        top:22%;
        width:42%;
        height:60%;
    }

}

</style>
</head>


<body>


<div id="experience">


    <!-- =================================================
         OPENING
    ================================================= -->

    <div id="opening">

        <div class="opening-logo">
            DECORUM
        </div>

    </div>


    <!-- =================================================
         REALISTIC HOUSE IMAGE
    ================================================= -->

    <div id="house"></div>


    <!-- =================================================
         BRAND
    ================================================= -->

    <div class="logo">
        DECORUM
    </div>


    <!-- =================================================
         LOCATION
    ================================================= -->

    <div class="location">
        BLOEMFONTEIN / ZA
    </div>


    <!-- =================================================
         ROMAN INDEX
    ================================================= -->

    <nav class="index">

        <button onclick="openSection('I')">
            I
        </button>

        <button onclick="openSection('II')">
            II
        </button>

        <button onclick="openSection('III')">
            III
        </button>

        <button onclick="openSection('IV')">
            IV
        </button>

    </nav>


    <!-- =================================================
         FRONT DOOR
    ================================================= -->

    <button
        class="door"
        onclick="enterHouse()"
        aria-label="Enter DECORUM">
    </button>


    <div class="door-message">
        ENTER
    </div>


    <!-- =================================================
         BOTTOM
    ================================================= -->

    <div class="bottom-mark"></div>


    <div
        class="enter"
        onclick="enterHouse()">

        ENTER

        <span class="enter-arrow">
            →
        </span>

    </div>


    <!-- =================================================
         TRANSITION
    ================================================= -->

    <div id="transition"></div>


</div>


<script>


/* =====================================================
   OPENING
===================================================== */

window.addEventListener("load",function(){

    setTimeout(function(){

        document
            .getElementById("opening")
            .classList.add("hide");

    },1800);

});


/* =====================================================
   ENTER HOUSE
===================================================== */

let entering = false;

function enterHouse(){

    if(entering) return;

    entering = true;

    const experience =
        document.getElementById("experience");

    experience.classList.add("entering");


    /*
       The realistic house zooms forward.
       The screen fades.
       Then we enter the interior.
    */

    setTimeout(function(){

        window.location.href = "house.html";

    },1300);

}


/* =====================================================
   ROMAN INDEX
===================================================== */

function openSection(section){

    if(section === "I"){
        window.location.href = "art.html";
    }

    if(section === "II"){
        window.location.href = "house.html";
    }

    if(section === "III"){
        window.location.href = "collection.html";
    }

    if(section === "IV"){
        window.location.href = "shop.html";
    }

}

</script>

</body>
</html>
