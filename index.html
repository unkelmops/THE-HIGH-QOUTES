<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DECORUM</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap');

:root {
    --cream: #eee9df;
    --muted: #aaa59c;
    --dark: #090909;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--dark);
    color: var(--cream);
    font-family: Inter, sans-serif;
}

canvas {
    display: block;
}

/* --------------------------------
   INTRO
-------------------------------- */

#intro {
    position: fixed;
    inset: 0;
    z-index: 20;
    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(255,255,255,.035),
            transparent 42%
        ),
        #090909;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

#intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-content {
    text-align: center;
}

.brand {
    font-family: "Cormorant Garamond", serif;
    font-size: clamp(4rem, 9vw, 9rem);
    font-weight: 400;
    letter-spacing: .16em;
    margin-left: .16em;
}

.enter-line {
    width: 90px;
    height: 1px;
    background: rgba(238,233,223,.55);
    margin: 38px auto 20px;
}

.enter-text {
    font-size: 10px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--muted);
}

/* --------------------------------
   HUD
-------------------------------- */

#hud {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

.logo-small {
    position: absolute;
    top: 28px;
    left: 32px;

    font-family: "Cormorant Garamond", serif;
    font-size: 23px;
    letter-spacing: .18em;
}

.location {
    position: absolute;
    top: 33px;
    right: 32px;

    font-size: 8px;
    letter-spacing: .24em;
    color: var(--muted);
    text-transform: uppercase;
}

.controls-help {
    position: absolute;
    bottom: 28px;
    left: 32px;

    font-size: 8px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: rgba(238,233,223,.45);
}

.crosshair {
    position: absolute;
    left: 50%;
    top: 50%;

    width: 4px;
    height: 4px;

    transform: translate(-50%, -50%);
    border: 1px solid rgba(238,233,223,.6);
    border-radius: 50%;
}

#interaction {
    position: absolute;
    left: 50%;
    bottom: 70px;

    transform: translateX(-50%);

    font-size: 9px;
    letter-spacing: .24em;
    text-transform: uppercase;

    color: var(--cream);

    opacity: 0;
    transition: opacity .25s ease;
}

#interaction.visible {
    opacity: 1;
}

/* --------------------------------
   LOADING
-------------------------------- */

#loading {
    position: fixed;
    inset: 0;
    z-index: 30;

    background: #090909;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: opacity .8s ease;
}

#loading.done {
    opacity: 0;
    pointer-events: none;
}

.loading-text {
    font-family: "Cormorant Garamond", serif;
    font-size: 20px;
    letter-spacing: .15em;
}
</style>
</head>

const colliders = [];

function box(
    x,
    y,
    z,
    w,
    h,
    d,
    material,
    collision = true
) {

    const geometry =
        new THREE.BoxGeometry(
            w,
            h,
            d
        );

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    scene.add(mesh);

    if (collision) {
        colliders.push(mesh);
    }

    return mesh;
}

function numeralTexture(text) {

    const canvas =
        document.createElement("canvas");

    canvas.width = 256;
    canvas.height = 256;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle = "#151412";

    ctx.fillRect(
        0,
        0,
        256,
        256
    );

    ctx.fillStyle = "#d8d0c2";

    ctx.font =
        "100px Georgia";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        text,
        128,
        128
    );

    const texture =
        new THREE.CanvasTexture(canvas);

    return texture;
}


function numeral(
    text,
    x,
    y,
    z,
    rotationY = 0
) {

    const material =
        new THREE.MeshStandardMaterial({
            map: numeralTexture(text),
            roughness: .75
        });

    const frame =
        box(
            x,
            y,
            z,
            1.2,
            1.2,
            .08,
            material,
            false
        );

    frame.rotation.y =
        rotationY;

    frame.userData.interactive = true;
    frame.userData.type = "numeral";
    frame.userData.value = text;

    return frame;
}

/* =========================================================
   COLLISION
========================================================= */

const playerRadius = .35;

function canMoveTo(position) {

    const playerBox =
        new THREE.Box3(
            new THREE.Vector3(
                position.x - playerRadius,
                0.2,
                position.z - playerRadius
            ),
            new THREE.Vector3(
                position.x + playerRadius,
                1.8,
                position.z + playerRadius
            )
        );


    for (const object of colliders) {

        const box =
            new THREE.Box3()
                .setFromObject(object);

        if (
            playerBox.intersectsBox(box)
        ) {
            return false;
        }
    }

    return true;
}


/* =========================================================
   MOVEMENT
========================================================= */

    forward: false,
    backward: false,
    left: false,
    right: false
};


document.addEventListener(
    "keydown",
    event => {

        switch (event.code) {

            case "KeyW":
                keys.forward = true;
                break;

            case "KeyS":
                keys.backward = true;
                break;

            case "KeyA":
                keys.left = true;
                break;

            case "KeyD":
                keys.right = true;
                break;

);


document.addEventListener(

                keys.forward = false;

/* =========================================================
   INTERACTION
========================================================= */

const raycaster =
    new THREE.Raycaster();

const interaction =
    document.getElementById(
        "interaction"
    );


function getInteractiveObject() {

    raycaster.setFromCamera(
        new THREE.Vector2(0, 0),
        camera
    );

    const objects =
        raycaster.intersectObjects(
            scene.children,
            true
        );

    for (const hit of objects) {

        let object = hit.object;

        while (
            object &&
            !object.userData.interactive
        ) {
            object = object.parent;
        }

        if (
            object &&
            object.userData.interactive
        ) {
            return object;
        }
    }

    return null;
}


function updateInteraction() {

    if (!controls.isLocked) {

        interaction.classList.remove(
            "visible"
        );

        return;
    }


    const object =
        getInteractiveObject();


    if (!object) {

        interaction.classList.remove(
            "visible"
        );

        return;
    }


    if (
        object.userData.type ===
        "door"
    ) {

        interaction.textContent =
            object.userData.open
            ? "CLOSE"
            : "ENTER";

    }


    if (
        object.userData.type ===
        "shop"
    ) {

        interaction.textContent =
            "OPEN";

    }


    if (
        object.userData.type ===
        "numeral"
    ) {

        interaction.textContent =
            object.userData.value
            ? object.userData.value
            : "LOOK";

    }


    interaction.classList.add(
        "visible"
    );
}


document.addEventListener(
    "click",
    () => {

        if (!controls.isLocked)
            return;


        const object =
            getInteractiveObject();


        if (!object)
            return;


        /* FRONT DOOR */

        if (
            object.userData.type ===
            "door"
        ) {

            if (
                !object.userData.open
            ) {

                object.userData.open =
                    true;

                object.rotation.y =
                    -Math.PI / 2;

            } else {

                object.userData.open =
                    false;

                object.rotation.y =
                    0;
            }

        }


        /* SHOP */

        if (
            object.userData.type ===
            "shop"
        ) {

/* =========================================================
   ANIMATION
========================================================= */

const clock =
    new THREE.Clock();

const velocity =
    new THREE.Vector3();

const direction =
    new THREE.Vector3();

const speed = 3.4;


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            .05
        );


    /* movement */

    direction.set(
        0,
        0,
        0
    );


    if (keys.forward)
        direction.z -= 1;

    if (keys.backward)
        direction.z += 1;

    if (keys.left)
        direction.x -= 1;

    if (keys.right)
        direction.x += 1;


    if (
        direction.lengthSq() > 0
    ) {

        direction.normalize();

        velocity.x =
            direction.x *
            speed *
            delta;

        velocity.z =
            direction.z *
            speed *
            delta;


        const forward =
            new THREE.Vector3();

        camera.getWorldDirection(
            forward
        );

        forward.y = 0;

        forward.normalize();


        const right =
            new THREE.Vector3()
                .crossVectors(
                    forward,
                    camera.up
                )
                .normalize();


        const movement =
            new THREE.Vector3();

        movement.addScaledVector(
            forward,
            -direction.z *
            speed *
            delta
        );

        movement.addScaledVector(
            right,
            direction.x *
            speed *
            delta
        );


        const newPosition =
            camera.position.clone();

        newPosition.add(
            movement
        );


        if (
            canMoveTo(
                newPosition
            )
        ) {

            camera.position.copy(
                newPosition
            );

        }

    }


    /* keep player height */

    camera.position.y =
        1.65;


    updateInteraction();


    renderer.render(
        scene,
        camera
    );
}


animate();


/* =========================================================
   LOADING
========================================================= */

window.addEventListener(
    "load",
    () => {

        setTimeout(
            () => {

                document
                    .getElementById("loading")
                    .classList.add("done");

            },
            700
        );

    }
);

</script>
